name: build-ios

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (route policy, no simulator)
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned Release for generic iOS device
        run: |
          set -o pipefail
          xcodebuild \
            -project InstagramUtility.xcodeproj \
            -scheme InstagramUtility \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/InstagramUtility.app"
          test -d "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry InstagramUtility-unsigned.ipa Payload
          unzip -l InstagramUtility-unsigned.ipa | grep "Payload/InstagramUtility.app/InstagramUtility$"
          ls -lh InstagramUtility-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: InstagramUtility-unsigned-ipa
          path: InstagramUtility-unsigned.ipa
          if-no-files-found: error
