name: killtube

on:
  push:
    paths:
      - 'killtube/**'
      - '.github/workflows/killtube.yml'
  pull_request:
    paths:
      - 'killtube/**'
      - '.github/workflows/killtube.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: killtube
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: node --check killtube.user.js

      - name: Tests (node:test, no dependencies)
        run: node --test
